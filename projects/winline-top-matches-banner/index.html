<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Winline — Топ‑матчи сегодня | интерактивный баннер</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="banner-wrapper" aria-label="Топ‑трансляции Winline">
    <section class="banner">
      <div class="topbar">
        <span class="winline-pill" aria-label="Winline">WINLINE</span>
        <a class="sports-logo" href="https://www.sports.ru/?utm_source=special-winline-top-matches-banner" target="_blank" rel="noopener noreferrer" aria-label="Sports.ru">
          <img src="https://dumpster.cdn.sports.ru/e/01/b6a5c8d6223d46030fe91d0aa70cc.png" alt="Sports" />
        </a>
      </div>
      <div class="title">Топ‑матчи сегодня</div>
      <div class="subtitle">Смотри бесплатно и успей забрать фрибет 3000 ₽</div>

      <div id="matches" class="matches"></div>

      <div class="cta-bottom">
        <button class="cta-big" id="ctaBig">Получить фрибет 3000 ₽ и смотреть</button>
        <div class="cta-note">Нажимая, переходите на сайт Winline. 18+</div>
      </div>
      <div class="footer-row">
        <div class="chip value">Рейтинг матча: высокий интерес</div>
        <div class="age">Реклама 18+</div>
      </div>
    </section>
  </main>

  <script src="./data/matches.js"></script>
  <script src="./script.js"></script>
  <script src="./resize.js"></script>
</body>
</html>
