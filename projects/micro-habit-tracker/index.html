<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>Micro Habit Tracker</title>
  <link rel="preconnect" href="https://senoval.cdn.sports.ru" crossorigin>
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%2300c78b' d='M18 6c3 10 18 12 16 26-2 12-13 15-13 26 0 5 4 8 11 6 10-3 18-14 18-26C50 20 37 9 34 4c-1-2-3-2-4 0-2 3-6 5-12 2z'/%3E%3C/svg%3E">
</head>
<body>
  <header class="app-hero">
    <div class="hero-left">
      <a class="brand" href="https://www.sports.ru/?utm_source=special-micro-habit-tracker" target="_blank" rel="noopener noreferrer">
        <img src="https://dumpster.cdn.sports.ru/e/01/b6a5c8d6223d46030fe91d0aa70cc.png" alt="Sports" class="brand-logo">
      </a>
      <div class="titles">
        <h1 class="h-title">Micro Habit Tracker</h1>
        <p class="h-sub">Крошечные шаги. Большие победы. Отслеживайте до 7 привычек ежедневно.</p>
      </div>
    </div>
    <div class="hero-actions">
      <span id="todayPill" class="pill">Сегодня: —</span>
      <button id="exportBtn" class="btn pill">Export JSON</button>
      <label for="importInput" class="btn pill">Import JSON</label>
      <input id="importInput" type="file" accept="application/json" hidden>
    </div>
  </header>

  <main class="container">
    <section class="toolbar">
      <button id="addHabitBtn" class="btn primary">+ Добавить привычку</button>
      <div class="spacer"></div>
      <button id="jumpTodayBtn" class="btn">Jump to Today</button>
      <button id="clearSelectedBtn" class="btn danger">Clear selected day</button>
    </section>

    <section class="legend board-head">
      <div class="days-header" id="daysHeader" aria-label="Последние 14 дней"></div>
      <div class="head-actions">
        <span class="pill" id="selectedDatePill">Selected: —</span>
        <label class="skip-wrap"><input id="skipDayToggle" type="checkbox"> <span>Skip day</span></label>
      </div>
    </section>

    <section class="legend legend-colors">
      <div class="legend-row">
        <span class="badge done"></span>
        <span>Выполнено</span>
        <span class="badge skipped"></span>
        <span>Пропуск (не ломает серию)</span>
        <span class="badge missed"></span>
        <span>Пропущено</span>
      </div>
      <p class="hint">Нажмите на клетку, чтобы переключить: Пропущено → Выполнено → Пропуск</p>
    </section>

    <section id="habitList" class="habit-list" aria-live="polite"></section>
  </main>

  <dialog id="habitDialog" class="dialog">
    <form id="habitForm" method="dialog" class="dialog-card">
      <h3 id="habitDialogTitle" class="h3">Новая привычка</h3>
      <label class="field">
        <span>Название</span>
        <input id="habitName" name="name" maxlength="40" required placeholder="Например: Растяжка 5 мин">
      </label>
      <label class="field">
        <span>Цвет</span>
        <input id="habitColor" name="color" type="color" value="#00c78b" required>
      </label>
      <menu class="dialog-actions">
        <button id="deleteHabitBtn" type="button" class="btn danger" hidden>Удалить</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="cancelDialog">Отмена</button>
        <button type="submit" class="btn primary" id="saveHabit">Сохранить</button>
      </menu>
    </form>
  </dialog>

  <template id="habitRowTpl">
    <article class="habit-row">
      <div class="habit-meta">
        <span class="dot"></span>
        <button class="habit-name" title="Редактировать привычку"></button>
        <span class="streak" title="Текущая серия">🔥 <b>0</b></span>
      </div>
      <div class="habit-grid" role="grid" aria-label="Последние дни"></div>
    </article>
  </template>

  <script src="./data/seed.js"></script>
  <script src="./script.js"></script>
  <script src="./resize.js"></script>
</body>
</html>
